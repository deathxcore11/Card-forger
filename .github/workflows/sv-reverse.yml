name: Scarlet Violet reverse witnesses
on:
  push:
    branches: [codex/aquapolis-foundation-pilot]
  workflow_dispatch:
jobs:
  oddish-butterfree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/sv-reverse-browser.mjs --validate-fixtures
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/sv-reverse-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-reverse-evidence
          path: test-results/
          retention-days: 2
