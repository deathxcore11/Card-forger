name: Foil boundaries and foldable scrolling
on:
  push:
    branches: [codex/aquapolis-foundation-pilot]
  workflow_dispatch:
jobs:
  foil-fold:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/foil-fold-browser.mjs --validate-fixtures
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/foil-fold-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foil-fold-evidence
          path: test-results/
