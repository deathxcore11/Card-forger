name: Daily market history
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
  push:
    branches: [claude/edit-publish-github-bpm8zu]
    paths:
      - scripts/market-history.py
      - scripts/market_catalogue.py
      - .github/workflows/market-history.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: market-history-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(github.event_name == 'push' && '["mtg"]' || '["mtg","ptcg","ygo"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ijson==3.4.0
      - name: Check public quotes and backfill new Magic printings
        run: python scripts/market-history.py
        env:
          HISTORY_GAME: ${{ matrix.game }}
          HISTORY_CATALOGUE: "1"
          HISTORY_MAGIC_ALL: "1"
