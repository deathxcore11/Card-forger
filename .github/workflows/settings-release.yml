name: Settings release verification
on:
  push:
    branches: [codex/settings-storage-refresh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/settings-layout-release.mjs
      - run: node tests/set-experience-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-release-layout
          path: |
            test-results/set-experience*
            test-results/settings-release-layout.json
            test-results/synthetic-search-settings-release-*

  foil-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ygo-rarity-foil-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-foil-compatibility
          path: test-results/ygo-rarity-foil/
