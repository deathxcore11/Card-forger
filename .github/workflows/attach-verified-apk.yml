# One-use transfer of an already signed and locally verified APK. This workflow
# neither builds nor signs. Fixed Git objects bypass the connector's per-request
# upload size limit; their exact combined checksum is required before attachment.
name: Attach verified CardStashy APK
on:
  push:
    branches: [codex/pack-details-meta-fixes]
    paths: [.github/workflows/attach-verified-apk.yml]
permissions:
  contents: write
jobs:
  attach:
    if: github.repository == 'deathxcore11/Card-forger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact verified signed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          parts=[('6922161955075c62b436dcbfb69adffd0180e793',8100000),('e9a6dfac5407e64ac1f9b40d21f9a14e70da0a8f',8100000),('6163441d311564f60b58e45667ae07f0abb22efa',8049035)]
          data=bytearray()
          for sha,size in parts:
              request=urllib.request.Request('https://api.github.com/repos/deathxcore11/Card-forger/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response: record=json.load(response)
              if record.get('sha')!=sha or record.get('encoding')!='base64': raise ValueError('Unexpected Git object')
              part=base64.b64decode(record['content'])
              if len(part)!=size or hashlib.sha1(b'blob '+str(size).encode()+b'\0'+part).hexdigest()!=sha: raise ValueError('Part integrity mismatch')
              data.extend(part)
          if len(data)!=24249035 or hashlib.sha256(data).hexdigest()!='13e40b5e7fbc86380f20120712bb29faf76f88bd9c893fd0128991ed0904da4e': raise ValueError('APK integrity mismatch')
          pathlib.Path('downloads/cardstashy-android-beta-0.5.2.apk').write_bytes(data)
          print('Verified exact signed APK: 24,249,035 bytes; SHA-256 matches release record.')
          PY
      - name: Attach APK and retire this transfer workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm downloads/cardstashy-android-beta-0.5.1.apk .github/workflows/attach-verified-apk.yml
          git add downloads/cardstashy-android-beta-0.5.2.apk
          git commit -m 'release: attach verified signed Android 0.5.2 APK'
          git push origin HEAD:codex/pack-details-meta-fixes
