name: Live market verification
on:
  push:
    branches: [claude/edit-publish-github-bpm8zu]
    paths: [.github/workflows/live-market-check.yml, scripts/live-market-check.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/live-market-check.py
