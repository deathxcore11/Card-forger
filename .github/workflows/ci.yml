name: Browser action receipt reproduction (NO DEPLOY)
on:
  push:
    branches: [codex/forge-receipt-diagnostic-20261026]
permissions:
  contents: read
jobs:
  receipt:
    if: github.repository == 'deathxcore11/Card-forger'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned browser tools
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/browser-tools"
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --only-shell chromium
      - name: Run synthetic HTTP receipt reproduction
        timeout-minutes: 1
        env:
          FORGE_BROWSER_TOOLS: ${{ runner.temp }}/browser-tools
        run: node diagnostics/reproduce-action-receipt.mjs
