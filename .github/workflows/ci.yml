name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in *.js *.mjs; do node --check "$f"; done
      - name: Unit and action tests
        run: npm test
  dropdown-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the known broken version for regression proof
        run: git fetch --depth=1 origin a570fb034b61f508b48427200bb3d69aab5323a6
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test dropdown gestures before release
        run: node tests/dropdown-browser.mjs
      - name: Fetch tilt regression baseline
        run: git fetch --depth=1 origin b1fc1fd79b0c9e7b9e46feb0101ca5c485d586c6
      - name: Test card tilt with browser orientation events
        run: node tests/tilt-browser.mjs
      - name: Test discovery, learning and responsive AI identity
        run: node tests/discovery-browser.mjs
      - name: Test interactive official rulebooks and learning
        run: node tests/rules-browser.mjs
      - name: Test ownership controls and condition values in the real app
        run: node tests/owned-browser.mjs
  scanner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test real reference images through scanner and collection
        run: node tests/scanner-browser.mjs
      - name: Test nonblocking mixed-game capture and mobile layout
        if: ${{ !cancelled() }}
        run: node test-batch-scan-browser.mjs
      - name: Test price outage recovery and honest mobile totals
        if: ${{ !cancelled() }}
        run: node tests/pricing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-browser-evidence
          path: test-results/
  database-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install disposable PostgreSQL test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.10
      - name: Exercise actual quota SQL without contacting production
        run: CARDSTASHY_PGLITE_MODULE="$PWD/node_modules/@electric-sql/pglite/dist/index.js" node test-server-safety-history-sql.mjs
