      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test accepted frame pixels, durable queue and expired reader isolation
