name: Isolated Forge exact container proof (DO NOT MERGE)
# Proof branch only. Never merge this workflow or its root Wrangler guard.
on:
  push:
    branches: [codex/forge-native-browser-proof-20261026]
permissions:
  contents: read
concurrency:
  group: isolated-forge-native-browser-proof
  cancel-in-progress: false
jobs:
  forge-container-proof:
    if: github.repository == 'deathxcore11/Card-forger' && github.ref == 'refs/heads/codex/forge-native-browser-proof-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify root deployment guard
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          g=json.loads('\n'.join(l for l in pathlib.Path('wrangler.jsonc').read_text().splitlines() if not l.lstrip().startswith('//')))
          assert g['main']=='__FORGE_BROWSER_PROOF_DO_NOT_DEPLOY__/intentionally-missing-worker.js'
          assert g['assets']['directory']=='__FORGE_BROWSER_PROOF_DO_NOT_DEPLOY__/intentionally-missing-assets'
          assert not pathlib.Path(g['main']).exists() and not pathlib.Path(g['assets']['directory']).exists()
          assert g['workers_dev'] is False and g['preview_urls'] is False and g['previews']=={}
          print('PASS deployment guard; no image push or deployment is part of this job')
          PY
      - name: Build once and prove exact deck startup in constrained offline container
        id: proof
        env:
          FORGE_PROOF_REVIEWED_NATIVE_SHA256: 586511f3e9bf28a6918ef696ce614e50b5dbdf55c0b14d9a54f1fd89967aeddd
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/forge-proof/hosting/cloudflare
          if ! bash scripts/docker-proof.sh; then
            if test -f evidence/docker-proof/build.log; then
              echo 'Public-source image build error summary (no runtime capability exists during image build):'
              grep -Ei 'error|failed|timeout|cancelled' evidence/docker-proof/build.log | tail -n 40 | cut -c1-600 || true
            fi
            exit 1
          fi
      - name: Retain bounded redacted proof results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: forge-exact-container-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/forge-proof/hosting/cloudflare/evidence/docker-proof/native.json
            experiments/forge-proof/hosting/cloudflare/evidence/docker-proof/image.txt
            experiments/forge-proof/hosting/cloudflare/evidence/docker-proof/resources.json
            experiments/forge-proof/hosting/cloudflare/evidence/docker-proof/stopped.txt
            experiments/forge-proof/hosting/cloudflare/evidence/docker-proof/inputs.txt
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: false
