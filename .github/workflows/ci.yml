name: Isolated Forge native browser proof (DO NOT MERGE)

# This replacement exists ONLY on the throwaway proof branch. It is not normal CI.
# Never open a PR or merge this branch. Every mutation is to an ephemeral game.
on:
  push:
    branches: [codex/forge-native-browser-proof-20261026]

permissions:
  contents: read

concurrency:
  group: isolated-forge-native-browser-proof
  cancel-in-progress: true

jobs:
  forge-browser-proof:
    if: github.repository == 'deathxcore11/Card-forger' && github.ref == 'refs/heads/codex/forge-native-browser-proof-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORGE_REV: e5a0f8156da70ffc7866f923bed371c0111707cd
      FORGE_PROOF_ROOT: ${{ runner.temp }}/forge-native-proof
      FORGE_BROWSER_TOOLS: ${{ runner.temp }}/forge-browser-tools
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/forge-browser-binaries
    steps:
      - name: Check out only this reviewed proof commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node without caches
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the existing pinned Chromium harness
        timeout-minutes: 4
        run: |
          npm install --prefix "$FORGE_BROWSER_TOOLS" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$FORGE_BROWSER_TOOLS/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Build pinned Forge and exercise the actual table in Chromium
        id: proof
        timeout-minutes: 14
        run: bash experiments/forge-proof/ci/run-browser-proof.sh
      - name: Retain only bounded sanitized proof evidence
        if: ${{ always() && steps.proof.outputs.upload_ready == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: forge-browser-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/forge-browser-proof/artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
          include-hidden-files: false
