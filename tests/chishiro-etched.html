</style></head><body><h1>Chishiro NEC #077 · foil-etched approximation</h1><p>Exact public Wizards reference. Fine metallic reflection is simulated, not a measured reproduction.</p><main></main><script type="module">

}
window.setEffects=setFinishEffects;attachFinishPreview(root);document.documentElement.dataset.ready='true';
</script></body></html>
