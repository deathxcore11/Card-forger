<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foil anchor grid verification</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../finish-effects.css"><link rel="stylesheet" href="../foil-fx.css"></head>
<body><main id="content" class="view-gallery"><div class="card-grid" id="list" style="max-width:420px;margin:auto"></div></main><script type="module">
import {finishAttrs,attachFinishPreview} from '../finish-preview.js';
import {normalizeYgo} from '../ygo.js';
const cases=(await (await fetch('../review/cases.json')).json()).cases.filter(c=>c.game==='ygo'&&c.key!=='ygo-gamma-rare');
const files={'9753964':'../test-fixtures/finish-effects/hot-red-dragon-abyss.json','38814750':'../test-fixtures/finish-effects/psy-framegear-gamma.json','74586817':'../test-fixtures/finish-effects/psy-framelord-omega.json'};
const tiers=(new URLSearchParams(location.hash.slice(1)).get('tiers')||'tn,t3,t4').split(',');
let html='',i=0;
for(const c of cases){const raw=await (await fetch(files[c.identity.cardId]||'../test-fixtures/finish-effects/dracotail-lukias.json')).json();
 html+=`<button class="grid-card" data-key="${c.key}" data-tier="${tiers[i++%tiers.length]}" ${finishAttrs('ygo',normalizeYgo(raw),c.identity.context,'large')}><img class="card-img" src="../review/${c.image}" alt=""><span class="tile-chrome"></span><span class="grid-meta"><span class="ellip">${c.key}</span></span></button>`;}
document.querySelector('#list').innerHTML=html;attachFinishPreview(document);document.documentElement.dataset.ready='1';
</script></body></html>
