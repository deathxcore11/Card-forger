<meta charset="utf-8">
<title>Planeswalk · CardStashy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<style>
/* Layout: a single game column. Top bar for the run, then one view at a time: map, battle, reward, rest, event. Single dark look on purpose, like the Play table. */
:root{
  --bg:#0d0f13; --mat:#151922; --panel:#1b202b; --line:#2c3341; --fg:#ece8df; --muted:#9ea3ad;
  --gold:#e8b95b; --red:#e8705a; --redDeep:#7a2a1d; --black:#a58bb8; --blackDeep:#3a2b47; --heal:#5fb87a; --sky:#6fb2ec;
  --display:"Marcellus",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--body)}
#app{max-width:980px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.5rem;color:var(--gold)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.main{background:var(--gold);color:#1b1406;border-color:var(--gold);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.top h1{font-size:1.35rem}
.top .life{display:flex;gap:8px;align-items:center;font-family:var(--mono)}
.lifebar{width:120px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.lifebar i{display:block;height:100%;background:var(--heal);transition:width .3s}
.emblems{display:flex;gap:6px}
.emb{width:26px;height:26px}
.top .spacer{flex:1}
details.deck{position:relative}
details.deck summary{list-style:none;cursor:pointer}
details.deck summary::-webkit-details-marker{display:none}
.decklist{position:absolute;right:0;top:110%;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;width:min(320px,80vw);max-height:360px;overflow:auto;display:grid;gap:4px;font-size:.85rem}

/* map */
.map{display:grid;gap:10px;justify-items:center;background:var(--mat);border:1px solid var(--line);border-radius:12px;padding:18px 12px}
.maprow{display:grid;grid-template-columns:repeat(3,minmax(0,110px));gap:10px;width:100%;justify-content:center}
.node{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:.78rem;color:var(--muted)}
.node b{font:1.15rem var(--display);color:var(--fg)}
.node.open{border-color:var(--gold);color:var(--fg);box-shadow:0 0 0 1px var(--gold),0 0 18px -6px var(--gold)}
.node.done{background:color-mix(in srgb,var(--gold) 16%,var(--panel));color:var(--fg)}
.node.past{opacity:.35}
.node:disabled{cursor:default}
.node.boss{grid-column:2}
.plane{font:500 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* battle */
.battle{background:var(--mat);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.side{display:flex;gap:8px;align-items:end;flex-wrap:wrap;min-width:0}
.side.foe{justify-content:flex-end}
.unit{position:relative;display:grid;justify-items:center;gap:3px;width:86px;font-size:.7rem;color:var(--muted);text-align:center;line-height:1.2}
.unit .art{width:100%;aspect-ratio:3/4;max-width:100%;border-radius:8px;border:1px solid var(--line);display:grid;align-content:space-between;padding:5px;background:linear-gradient(165deg,var(--tint),var(--panel) 75%)}
.unit .art .glyph{font:1.6rem var(--display);color:var(--fg);opacity:.85;justify-self:center;margin-top:8px}
.unit .stats{font:600 .78rem var(--mono);color:var(--fg);justify-self:end;background:rgba(0,0,0,.45);border-radius:4px;padding:0 4px}
.unit .name{color:var(--fg);font-size:.72rem}
.ally{--tint:var(--redDeep)}
.foe .unit{--tint:var(--blackDeep);cursor:pointer;background:none;border:0;padding:0}
.foe .unit.elite .art{border-color:var(--black)}
.foe .unit.boss{width:110px}
.foe .unit.boss .art{border:2px solid var(--black)}
.foe .unit.aim{cursor:crosshair}
.foe .unit.aim .art{outline:2px dashed var(--gold);outline-offset:3px}
.foe .unit.aim:hover .art{outline-style:solid;box-shadow:0 0 18px -4px var(--gold)}
.foe .unit:disabled{cursor:default;opacity:1}
.ally.chosen .art,.card[data-chosen]{outline:2px solid var(--gold);outline-offset:2px;transform:translateY(-8px)}
.hero{width:104px;--tint:var(--red)}
.hero .art{border:2px solid var(--gold)}
.ally.sick .art{opacity:.55}
.tag{font:500 .62rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.hero .bar i{background:var(--heal)}
.ally .bar i{background:var(--heal)}
.intent{font:600 .72rem var(--mono);border:1px solid var(--red);color:var(--red);border-radius:999px;padding:1px 8px;white-space:nowrap}
.intent.buff,.intent.summon,.intent.transform{border-color:var(--sky);color:var(--sky)}
.intent.drain{border-color:var(--black);color:var(--black)}
.pop{position:absolute;top:30%;left:50%;transform:translateX(-50%);font:600 1.2rem var(--mono);color:var(--red);pointer-events:none;animation:pop .9s ease-out forwards;text-shadow:0 2px 6px #000}
.pop.heal{color:var(--heal)}
@keyframes pop{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}
.slot{width:70px;aspect-ratio:3/4;border:1px dashed var(--line);border-radius:8px}
.loyal{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);display:grid;place-items:center;font:600 .8rem var(--mono);color:var(--gold)}
.foe .loyal{border-color:var(--black);color:var(--black);left:auto;right:-8px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .spacer{flex:1}
.foot{display:flex;gap:14px;align-items:flex-end}
.energy{flex:none;width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--red) 55%,var(--bg)),var(--bg));display:grid;place-items:center;font:600 1.4rem var(--mono)}
.hand{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.card{width:112px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:7px;display:grid;gap:4px;text-align:left;font-size:.72rem;line-height:1.3;transition:transform .12s}
.card:hover:not(:disabled){transform:translateY(-6px);border-color:var(--gold)}
.card:disabled{opacity:.45;cursor:default}
.card .head{display:flex;justify-content:space-between;gap:4px;align-items:start}
.card .head b{font-size:.78rem;color:var(--fg)}
.card .cost{flex:none;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1b1406;display:grid;place-items:center;font:600 .72rem var(--mono)}
.card .pic{height:40px;border-radius:5px;background:linear-gradient(160deg,var(--red),var(--redDeep));display:grid;place-items:center;font:1.1rem var(--display);color:var(--fg)}
.card .kind{font:500 .6rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card.foil{border-color:var(--gold);background:linear-gradient(120deg,var(--panel) 30%,color-mix(in srgb,var(--gold) 22%,var(--panel)) 50%,var(--panel) 70%);background-size:220% 100%;animation:sheen 4s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.log{font-size:.8rem;color:var(--muted);min-height:1.3em}
.piles{font:500 .72rem var(--mono);color:var(--muted);display:grid;gap:2px;flex:none}

/* screens */
.screen{background:var(--mat);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:14px;justify-items:start}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.option{display:grid;gap:4px;text-align:left;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.option:hover{border-color:var(--gold)}
.note{font-size:.82rem;color:var(--muted);max-width:70ch}
@media (max-width:620px){.field{grid-template-columns:1fr}.side.foe{justify-content:flex-start;order:-1}.unit{width:74px}.hero{width:88px}.card{width:100px}}
@media (prefers-reduced-motion:reduce){.pop,.card.foil{animation:none}.card{transition:none}}
.ally{background:none;border:0;padding:0}
.ally.ready{cursor:pointer}
.ally.ready .art{border-color:var(--gold);box-shadow:0 0 14px -4px var(--gold)}
.ally.tapped .art{transform:rotate(12deg);opacity:.6}
.ally .art{transition:transform .25s}
.kw{font:500 .6rem var(--mono);color:var(--gold)}
.shield{font:600 .62rem var(--mono);color:var(--sky)}
@media (prefers-reduced-motion:reduce){.ally .art{transition:none}}
.foe .unit.acting .art{transform:translateX(-16px) scale(1.06);border-color:var(--red);box-shadow:0 0 20px -4px var(--red)}
.foe .unit .art{transition:transform .2s,box-shadow .2s}
.unit.struck .art{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.unit.struck .art{animation:none}.foe .unit .art{transition:none}}
.unit{grid-template-columns:minmax(0,1fr)}
.unit .art{box-sizing:border-box;min-width:0;overflow:hidden}
.unit .tag{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.56rem}
.unit .stats{white-space:nowrap}
.hero .art{width:100%;height:auto}
@media (max-width:620px){.slot{display:none}.foot{flex-wrap:wrap}.hand{order:3;flex-basis:100%}.hand .card{width:calc(50% - 4px);box-sizing:border-box}.energy{width:52px;height:52px}.piles{margin-left:auto}.side{flex-wrap:wrap}}

 if(a==='hero')return newRun(reward&&reward.seed,b.dataset.k);
 if(a==='go')return enter(+b.dataset.r,+b.dataset.l);
 if(a==='closeinspect'){c.inspect=null;c.showHist=0;return render()}
 if(a==='giftok'){gift=null;return render()}
 if(a==='hist'){c.showHist=!c.showHist;c.inspect=null;return render()}
 if(a==='target'){const t=c.enemies.find(e=>e.id===+b.dataset.id),P=c.pending;if(!t)return;if(FORM&&c.arrange&&c.guardSel){const g=c.allies.find(y=>y.id===c.guardSel);c.guardSel=null;if(g){c.allies.forEach(y=>{if(y.guard===t.id&&y!==g)y.guard=null});g.guard=t.id;c.log=`${g.name} guards against ${t.name}.`}return render()}if(!P){c.inspect=c.inspect===t.id?null:t.id;return render()}c.inspect=null;if(P.kind==='card')return play(c.hand.findIndex(h=>h.id===P.cid),t,P.mode);if(P.kind==='atk'){const x=c.allies.find(y=>y.id===P.id);return x&&attack(x,t)}if(P.kind==='plus')return ability(false,t);if(P.kind==='belt')return useToken(P.slot,t);if(P.kind==='sacT')return bombard(c.allies.find(y=>y.id===P.sac),t);return}
 if(a==='target-ally'){const t=c.allies.find(y=>y.id===+b.dataset.id);if(!t)return;if(c.pending.kind==='sac'){const only=solo();if(only)return bombard(t,only);c.pending={kind:'sacT',aim:'enemy',sac:t.id};c.log=`Fling ${t.name} at which enemy?`;return render()}if(c.pending.kind==='belt')return useToken(c.pending.slot,t);if(c.pending.kind!=='card')return;return play(c.hand.findIndex(h=>h.id===c.pending.cid),t,c.pending.mode)}
 if(a==='mode'){const P=c.pending;if(!P||!P.cid)return;const i=c.hand.findIndex(h=>h.id===P.cid),m=+b.dataset.m,M=i>=0&&C[c.hand[i].key].modes;if(!M||!M[m])return;return play(i,null,m)}
 if(a==='belt'){return useToken(+b.dataset.s)}
 if(a==='cancel'){c.pending=null;c.log='Cancelled.';return render()}
 if(a==='atk'){const x=c.allies.find(y=>y.id===+b.dataset.id);return x&&attack(x)}
 if(a==='formtoggle'){try{localStorage.setItem('pw-form',FORM?'0':'1')}catch(e){}location.reload();return}
 if(a==='arrange'){c.arrange=!c.arrange;c.guardSel=null;c.log=c.arrange?'Tap an ally to move it to the front, then an enemy to have it guard against that one.':'Formation set.';return render()}
 if(a==='front'){const x=c.allies.find(y=>y.id===+b.dataset.id);if(x&&!x.tapped){c.guardSel=x.id}const g=x&&(stacks().find(g=>g.includes(x))||[x]);if(x){c.allies=c.allies.filter(y=>!g.includes(y)).concat(g);c.log=`${x.name} moves to the front.${x.tapped?'':' Tap an enemy to have it guard against that one.'}`}return render()}
 if(a==='all')return attackAll();
 if(a==='play'){const i=+b.dataset.i;if(c.pending&&c.pending.kind==='hand'){const P=c.pending,j=c.hand.findIndex(h=>h.id===P.cid);if(c.hand[i]?.id===P.cid||j<0){c.pending=null;c.log='Cancelled.';return render()}c.pending=null;c.pickId=c.hand[i].id;return play(j)}if(c.pending&&(c.pending.kind==='card'||c.pending.kind==='mode')&&c.hand[i]?.id===c.pending.cid){c.pending=null;c.log='Cancelled.';return render()}return play(i)}
 if(a==='plus')return ability(false);
 if(a==='minus')return ability(true);
 if(a==='ult')return ability('ult');
 if(a==='end'){if(c.energy>0&&c.nudge!==c.turn&&c.hand.some(h=>canPlay(h))){c.nudge=c.turn;nudgeEnd();return}return endTurn()}
 if(a==='emb'){offerLog('emblem',reward.embs.map(k=>EMB[k].name),EMB[b.dataset.k].name);run.emblems.push(b.dataset.k);reward.embs=[];return render()}
 if(a==='claim'){if(run.claimed){run.deck.push(mk(run.claimed.k));run.claimed=null}return render()}
 if(a==='ante-skip'){const {k,depth}=reward.ante;return startFight([k],'elite',depth)}
 if(a==='ante-wager'){const pk=reward.anteId&&run.deck.find(d=>d.id===reward.anteId);if(pk)return anteFight(pk);reward.wagering=1;return render()}
 if(a==='ante-change'){reward.wagering=1;return render()}
 if(a==='ante-back'){reward.wagering=0;return render()}
 if(a==='ante-pick'){reward.anteId=+b.dataset.id;reward.wagering=0;return render()}
 if(a==='take'){offerLog(reward.treasure?'treasure':'card',(reward.cards||[]).map(k=>C[k].name).concat(reward.sig?[C[reward.sig.k].name]:[]),C[b.dataset.k].name);const cd=mk(b.dataset.k);if(b.dataset.n2==='sig'&&reward.sig&&reward.sig.foil)cd.foil=true;run.deck.push(cd);return toMap()}
 if(a==='back'){reward=null;return render()}
 if(a==='skip'||a==='leave'){if(view==='reward'&&reward&&reward.cards&&reward.cards.length)offerLog(reward.treasure?'treasure':'card',reward.cards.map(k=>C[k].name),null);return toMap()}
 if(a==='buy'){const x=reward.shop.cards[+b.dataset.n];if(x&&!x.sold&&run.gold>=x.price){offerLog('shop',reward.shop.cards.map(y=>C[y.k].name),C[x.k].name);run.gold-=x.price;x.sold=true;run.deck.push(mk(x.k))}return render()}
 if(a==='buyemb'){const x=reward.shop.emb;if(x&&!x.sold&&run.gold>=x.price){offerLog('shop-emblem',[EMB[x.k].name],EMB[x.k].name);run.gold-=x.price;x.sold=true;run.emblems.push(x.k)}return render()}
 if(a==='shopremovepick'){reward.removing=1;return render()}
 if(a==='shopback'){reward.removing=0;reward.foiling=0;return render()}
 if(a==='shopfoilpick'){reward.foiling=1;return render()}
 if(a==='shopfoil'){const sh=reward.shop,x=run.deck.find(d=>d.id===+b.dataset.id);if(x&&sh.foil&&!sh.foil.sold&&run.gold>=sh.foil.price){run.gold-=sh.foil.price;sh.foil.sold=true;x.foil=true}reward.foiling=0;return render()}
 if(a==='shopremove'){const sh=reward.shop;if(run.gold>=sh.remove.price){run.gold-=sh.remove.price;sh.remove.sold=true;run.removed=(run.removed||0)+1;run.deck=run.deck.filter(d=>d.id!==+b.dataset.id)}reward.removing=0;return render()}
 if(a==='sac'){c.pending={kind:'sac',aim:'ally'};c.log='Goblin Bombardment: choose an ally to sacrifice.';return render()}
 if(a==='bossemb')return nextAct(b.dataset.k);
 if(a==='startemb'){run.claimed=null;if(run.startPick&&run.startPick.includes(b.dataset.k)){run.emblems.push(b.dataset.k);if(b.dataset.k==='contract'){run.max-=4;run.hp=Math.min(run.hp,run.max)}}run.startPick=null;return toMap()}
 if(a==='pactmyth'){offerLog('bargain',[reward.myth&&EMB[reward.myth].name,reward.rare&&EMB[reward.rare].name].filter(Boolean),reward.myth&&EMB[reward.myth].name);run.max-=15;run.hp=Math.min(run.hp,run.max);if(reward.myth)run.emblems.push(reward.myth);return toMap()}
 if(a==='pactcurse'){offerLog('bargain',[reward.myth&&EMB[reward.myth].name,reward.rare&&EMB[reward.rare].name].filter(Boolean),reward.rare&&EMB[reward.rare].name);if(reward.rare)run.emblems.push(reward.rare);run.deck.push(mk('doubt'));return toMap()}
 if(a==='heal'){heal(Math.round(run.max*.3));return toMap()}
 if(a==='purify'){const x=run.deck.find(d=>d.key==='doubt');if(x){x.key='clarity';x.foil=false}return toMap()}
 if(a==='foilpick'){reward={foil:1};return render()}
 if(a==='restburn'){reward={removing:1};return render()}
 if(a==='foil'){const x=run.deck.find(d=>d.id===+b.dataset.id);if(x)x.foil=true;return toMap()}
 if(a==='blood'){if(!shrinePool().length)return;run.hp-=10;if(run.hp<=0){run.hp=0;view='over';return render()}const left=shrinePool();if(left.length)run.emblems.push(pick(left));return toMap()}
 if(a==='burn'){reward.removing=1;return render()}
 if(a==='remove'){run.deck=run.deck.filter(d=>d.id!==+b.dataset.id);return toMap()}
 if(a==='loot'){const k=pick(poolOf('C'));run.deck.push(mk(k));gift={k,why:'Found in the cart'};return toMap()}
 if(a==='bandage'){heal(reward&&reward.ev==='ruins'?10:12);return toMap()}
 if(['tend','bless','hedron','dig'].includes(a))return evChoice(a);
});
function evChoice(a){
 const hurtRun=n=>{run.hp-=n;if(run.hp<=0){run.hp=0;view='over';render();return true}};
 if(a==='tend'){if(hurtRun(6))return;const k=pick(poolOf('U'));run.deck.push(mk(k));gift={k,why:'The cathar\'s gift'}}
 if(a==='bless')heal(8);
 if(a==='hedron'){if(hurtRun(8))return;const xs=run.deck.filter(d=>!d.foil&&C[d.key]&&C[d.key].kind!=='Curse');if(xs.length){const x=pick(xs);x.foil=true;gift={k:x.key,foil:true,why:'The hedron foils a card'}}}
 if(a==='dig'){if(rng()<.5){const k=pick(poolOf('R'));run.deck.push(mk(k));gift={k,why:'Dug out of the ruins'}}else if(hurtRun(10))return}
 return toMap()}
// A shared link (?seed=…&hero=R) starts that run, unless a run is already in progress here.
if(!resumeRun()){let q=null;try{q=new URLSearchParams(location.search)}catch{}const qs=q&&+q.get('seed');newRun(qs>0?qs:undefined,qs>0&&HEROES[q.get('hero')]?q.get('hero'):undefined)}
</script>
