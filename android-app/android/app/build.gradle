apply plugin: 'com.android.application'

// The Forge rules engine inside the app, built by ../../forge-engine/build-engine.sh. Without that
// build output this is the regular app, whose matches run on the Forge server. With it, CPU matches
// run on the phone. -PforgeEngineTest gives the test build its own package, so it installs beside
// the regular app instead of over it.
def forgeEngine = file('../../forge-engine/build/android')
def withForgeEngine = forgeEngine.directory

android {
    namespace = "dev.cardstashy.integration"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cardstashy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 70
        versionName "0.12.34-beta"
        if (withForgeEngine) minSdkVersion 26 // Forge's own Android minimum (java.nio.file)
        if (project.hasProperty('forgeEngineTest')) { applicationIdSuffix ".forgetest"; versionNameSuffix "-forge-test" }
        manifestPlaceholders = [largeHeap: withForgeEngine ? "true" : "false"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            noCompress 'gzip'
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing reads a key kept outside this source tree (CARDSTASHY_SIGNING=/path/signing.properties).
    def signingFile = System.getenv('CARDSTASHY_SIGNING') ? file(System.getenv('CARDSTASHY_SIGNING')) : null
    signingConfigs {
        if (signingFile?.exists()) {
            def s = new Properties(); signingFile.withInputStream { s.load(it) }
            release { storeFile file(s.storeFile); storePassword s.storePassword; keyAlias s.keyAlias; keyPassword s.keyPassword }
        }
    }
    buildTypes {
        release {
            if (signingFile?.exists()) signingConfig signingConfigs.release
            // R8 drops unused AndroidX code (proguard-rules.pro keeps the app, Capacitor and Cordova whole)
            // so the APK fits Cloudflare's 25 MiB download limit.
            // Forge looks up many classes by name, so the engine build is not shrunk.
            minifyEnabled !withForgeEngine
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    if (withForgeEngine) {
        sourceSets.main.java.srcDirs += '../../forge-engine/android/java'
        sourceSets.main.assets.srcDirs += "${forgeEngine}/assets"
        // Forge's libraries repeat license files; their service registrations are merged.
        packaging.resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module', 'META-INF/versions/**', 'module-info.class']
        packaging.resources.merges += ['META-INF/services/**']
    }
}

// Forge brings full Guava, which already holds AndroidX's ListenableFuture.
if (withForgeEngine) configurations.configureEach { exclude group: 'com.google.guava', module: 'listenablefuture' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    if (withForgeEngine) implementation fileTree(include: ['*.jar'], dir: "${forgeEngine}/libs")
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
