plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The native test app: Home > Quick Play > a real CPU match on the Forge engine inside the app.
// It has its own package, so it installs beside the live CardStashy app and never touches it.
// scripts/prepare-assets.sh fills engine-libs/ and src/main/assets/ (engine, card art, sounds, mats).
android {
    namespace = 'dev.cardstashy.nativeplay'
    compileSdk = 36
    defaultConfig {
        applicationId 'com.cardstashy.app.nativetest'
        minSdk 26 // Forge's own Android minimum (java.nio.file)
        targetSdk 36
        versionCode 26
        versionName '0.4.7-native-test'
    }
    buildTypes {
        release {
            // Forge looks up many classes by name, so nothing is shrunk. Signing happens after the
            // build with the release key, which never enters this repository.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Forge is built for desktop Java 17+ and calls APIs Android only has from 14 (Stream.toList and others):
        // library desugaring backports them, so Android 8 to 13 handhelds (Portal 2) can play.
        coreLibraryDesugaringEnabled true
    }
    kotlin { jvmToolchain(21) }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true; unitTests.all { it.systemProperty 'roborazzi.test.record', 'true'; it.systemProperty 'shotsDir', rootProject.file('shots').absolutePath; it.systemProperty 'engineRoot', System.getenv('ENGINE_ROOT') ?: ''; it.systemProperty 'repoRoot', rootProject.projectDir.parentFile.parentFile.absolutePath; it.maxHeapSize = '3g'; it.forkEvery = 20; it.testLogging { showStandardStreams = true } } }
    androidResources { noCompress += ['zip', 'ogg', 'jpg', 'webp'] }
    packaging.resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module', 'META-INF/versions/**', 'module-info.class']
    packaging.resources.merges += ['META-INF/services/**']
    // 3D cards' depth model runs on ONNX Runtime: 64-bit ARM only (every phone and handheld we target), packed compressed so the
    // download grows by about 13 MB, not 34. Elsewhere the library is absent and cards keep the window-only depth (DepthModel).
    packaging.jniLibs.excludes += ['lib/armeabi-v7a/libonnxruntime*.so', 'lib/x86/libonnxruntime*.so', 'lib/x86_64/libonnxruntime*.so']
    packaging.jniLibs.useLegacyPackaging = true
}

// Robolectric's own downloader ignores the build proxy, so Gradle fetches its Android jar and the
// tests run it offline from build/robolectric.
configurations { robolectricSdk }
def robolectricDir = layout.buildDirectory.dir('robolectric')
tasks.register('robolectricJars', Copy) { from configurations.robolectricSdk; into robolectricDir }
tasks.withType(Test).configureEach {
    dependsOn 'robolectricJars'
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir', robolectricDir.get().asFile.absolutePath
}

// Forge brings full Guava, which already holds AndroidX's ListenableFuture.
configurations.configureEach { exclude group: 'com.google.guava', module: 'listenablefuture' }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: '../engine-libs')
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // Card art streamed like the web (Scryfall CDN), cached on disk and in memory (step 1, online only).
    implementation 'io.coil-kt.coil3:coil-compose:3.2.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.2.0'
    implementation 'io.coil-kt.coil3:coil-svg:3.2.0'
    // Scanner: the phone's camera (CameraX), whose frames go to the site's scanner code.
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1' // 3D cards: the on-phone depth model (MODEL-LICENSE.txt)
    // QuickJS for the web's Deck Forge bundle (assets/deck-engine.js): the same builder as the site, never a Kotlin rewrite.
    implementation files('../qjs-libs/zipline-android-1.24.0.aar')
    testImplementation files('../qjs-libs/zipline-jvm-1.24.0.jar')
    // JUnit from the local Gradle install when present (Maven Central rate-limits the cloud builder).
    // Screens rendered on the JVM (Robolectric native graphics) for Randall's screenshots; no emulator needed.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    robolectricSdk 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.43.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.43.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.compose.ui:ui-test-manifest'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    def gradleJunit = file("${gradle.gradleHomeDir}/lib/junit-4.13.2.jar")
    if (gradleJunit.exists()) testImplementation files(gradleJunit, "${gradle.gradleHomeDir}/lib/hamcrest-core-1.3.jar")
    else testImplementation 'junit:junit:4.13.2'
}

// 0.4.86 crash (Randall 16 Nov: every match closed the app right after the coin toss). The board's content lambda had grown to
// 264 registers as one method; the release D8 then read a boxed Integer argument where the $changed int belongs, and Android's
// verifier rejected the whole ForgeTableKt class (VerifyError) the moment the table composed. Robolectric runs the JVM classes,
// so no unit test saw it. This check reads the built APK's dex and fails the release build if any method of ours needs more
// than 255 registers (past that, 8-bit instructions like and-int/lit8 cannot reach the arguments and D8 has to shuffle them).
def dexRegisterLimit = 255
def checkDexRegisters = { File apk ->
    def tools = new File(android.sdkDirectory, 'build-tools').listFiles()?.findAll { new File(it, 'dexdump').exists() }?.sort { it.name }
    if (!tools) throw new GradleException("dexdump not found under ${android.sdkDirectory}/build-tools: the dex register check cannot run")
    def dexdump = new File(tools.last(), 'dexdump')
    def tmp = new File(buildDir, 'dex-register-check'); project.delete(tmp); tmp.mkdirs()
    def over = []
    def zip = new java.util.zip.ZipFile(apk)
    try {
        zip.entries().findAll { it.name ==~ /classes\d*\.dex/ }.each { e ->
            def dex = new File(tmp, e.name); dex.withOutputStream { o -> o << zip.getInputStream(e) }
            def out = new ByteArrayOutputStream()
            project.exec { commandLine dexdump.absolutePath, dex.absolutePath; standardOutput = out; errorOutput = new ByteArrayOutputStream() }
            def cls = null; def name = null
            out.toString('UTF-8').eachLine { line ->
                def c = line =~ /Class descriptor\s*:\s*'(.*)'/; if (c.find()) cls = c.group(1)
                def n = line =~ /^\s+name\s*:\s*'(.*)'/; if (n.find()) name = n.group(1)
                def r = line =~ /^\s+registers\s*:\s*(\d+)/
                if (r.find() && cls?.startsWith('Ldev/cardstashy/') && (r.group(1) as int) > dexRegisterLimit) over << "${r.group(1)} registers: $cls $name"
            }
        }
    } finally { zip.close() }
    project.delete(tmp)
    if (over) throw new GradleException("Methods past $dexRegisterLimit registers (split them, see ForgeBoard's TablePart):\n" + over.join('\n'))
    logger.lifecycle("Dex register check: every dev.cardstashy method is at most $dexRegisterLimit registers (${apk.name})")
}
tasks.register('checkDexRegisters') {
    description = 'Fails if a release dex method of ours needs more than 255 registers (the 0.4.86 VerifyError).'
    dependsOn 'assembleRelease'
    doLast {
        def apks = fileTree(layout.buildDirectory.dir('outputs/apk/release')).matching { include '*.apk' }.files
        if (apks.isEmpty()) throw new GradleException('No release APK to check')
        apks.each { checkDexRegisters(it) }
    }
}
afterEvaluate { tasks.named('assembleRelease') { finalizedBy 'checkDexRegisters' } }
