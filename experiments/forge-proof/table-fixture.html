<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CardStashy · Play table fixture</title>
<!-- Development fixture only (not deployed; see .assetsignore). Mounts the live
     Forge table with a fixed native snapshot so layout changes can be compared
     on the same board. No transport, account or rules logic is involved. -->
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<script>for(const f of ["600 16px Manrope","600 16px Cinzel","16px \"DM Sans\""])document.fonts?.load(f);</script>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../community-curation.css">
<link rel="stylesheet" href="../../magic-matchups.css">
<link rel="stylesheet" href="../../settings-theme.css">
<link rel="stylesheet" href="../../aura.css">
<link rel="stylesheet" href="../../collection-display.css">
<link rel="stylesheet" href="../../finish-effects.css">
<link rel="stylesheet" href="../../sets-ui.css">
<link rel="stylesheet" href="../../printing-picker.css">
<link rel="stylesheet" href="../../game-tabs.css">
<link rel="stylesheet" href="../../brand-motion.css">
<link rel="stylesheet" href="../../home-overview.css">
<link rel="stylesheet" href="../../deck-viewer.css">
<link rel="stylesheet" href="../../play-menu.css">
<link rel="stylesheet" href="../../polish.css">
<!-- Loaded by app.js when a match opens, in this order. -->
<link rel="stylesheet" id="practiceTableStyles" href="../phase-engine/match-table.css">
<link rel="stylesheet" id="forgeHostedTableStyles" href="../../play-forge-table.css">
<!-- The fixture has no server, so it refuses every action the table sends. That refusal is not a layout
     state the design gate should judge; hide the connection toast and diagnostic here only. -->
<style>.forge-toast,.forge-diagnostic,.forge-diagnostic+button,.forge-activity[data-kind=connection]{display:none!important}</style>
</head>
<body class="glass practice-table-open" data-view="play" data-game="mtg">
<main id="practicePlayerMat" aria-label="Practice player mat" data-engine="forge-hosted"></main>
<script type="module">
import {mountForgeTable} from './forge-table.mjs';
import {createForgePresentationSession} from './forge-session.mjs';

const params = new URLSearchParams(location.search);
const STATE = params.get('state') || 'main';
const YOU = 1, CPU = 2;
// ?state=pod: a four-player Commander pod, you and three CPUs (seats 2, 3 and 4).
const POD = STATE === 'pod' || STATE === 'podattack' || STATE === 'podout' || STATE === 'podswing';

// Board contents per player. [name, options] — options: tapped, attacking, blocking, damage, token, imageKey, counters, sick.
const BASE = {
  you: {
    battlefield: [['Hill Giant'], ['Grizzly Bears'], ['Goblin Guide'], ['Mountain'], ['Mountain', {tapped: true}], ['Mountain'], ['Forest'], ['Forest'], ['Arcane Signet']],
    hand: ['Lightning Bolt', 'Monastery Swiftspear', 'Play with Fire', 'Skewer the Critics', 'Path to Exile', 'Forest', 'Llanowar Elves'],
    graveyard: ['Shock', 'Lava Spike', 'Rampant Growth'],
    exile: [],
    command: ['Klothys, God of Destiny'],
  },
  cpu: {
    battlefield: [['Island'], ['Island', {tapped: true}], ['Island'], ['Grizzly Bears'], ['Hill Giant'], ['Sol Ring']],
    hand: 7,
    graveyard: ['Counterspell', 'Opt', 'Brainstorm', 'Ponder'],
    exile: ['Swords to Plowshares'],
    command: ['Talrand, Sky Summoner'],
  },
};
if (STATE === 'dense' || STATE === 'crowded') {
  BASE.you.battlefield.push(['Llanowar Elves'], ['Elvish Mystic'], ['Fyndhorn Elves', {sick: true}], ['Craterhoof Behemoth'], ['Krenko, Tin Street Kingpin', {counters: {P1P1: 2}}], ['Ghalta, Primal Hunger', {damage: 3}],
    ...Array.from({length: 4}, () => ['Goblin', {token: true, imageKey: 't:r_1_1_goblin_haste'}]),
    ...Array.from({length: 4}, () => ['Mountain']), ...Array.from({length: 3}, () => ['Forest', {tapped: true}]), ['Sol Ring'], ['Mind Stone']);
  BASE.cpu.battlefield.push(['Talrand, Sky Summoner'], ['Delver of Secrets'], ['Snapcaster Mage'], ['Frost Titan'], ['Phantasmal Image'], ...Array.from({length: 3}, () => ['Island']), ['Command Tower'], ['Fellwar Stone']);
}
if (STATE === 'discard') BASE.you.hand.push('Shock');
if (POD) {
  BASE.cpu2 = {battlefield: [['Mountain'], ['Mountain', {tapped: true}], ['Mountain'], ['Swamp'], ['Goblin Guide', {attacking: STATE === 'podattack'}], ['Hill Giant', {attacking: STATE === 'podattack'}], ['Arcane Signet']], hand: 4, graveyard: ['Shock'], exile: [], command: ['Krenko, Mob Boss']};
  BASE.cpu3 = {battlefield: [['Plains'], ['Plains'], ['Forest'], ['Serra Angel'], ['Sol Ring']], hand: 6, graveyard: [], exile: [], command: ['Giada, Font of Hope']};
}
// Your commander out on the battlefield: its crest stays beside your profile, dimmed.
if (STATE === 'cmdfield') { BASE.you.command = []; BASE.you.battlefield.push(['Klothys, God of Destiny', {commander: true}]); }
// A Commander-sized hand and a pile of identical triggers (View full hand, the ×N stack badge).
if (STATE === 'crowded') BASE.you.hand.push('Shock', 'Opt', 'Brainstorm', 'Lightning Bolt', 'Ponder', 'Counterspell');
// The owner's real early board: the CPU went first and played a land; you played Forest
// and Many Partings made a Food token.
if (STATE === 'early' || STATE === 'pay') {
  Object.assign(BASE.you, {battlefield: [['Forest'], ['Food', {token: true, imageKey: 't:c_a_food_sac', type: 'Token Artifact — Food', text: '{2}, {T}, Sacrifice this token: You gain 3 life.'}]],
    hand: ['Mountain', 'Legion Warboss', 'Mountain', 'Rampant Growth', "Witch's Mark", "Krenko's Command"], graveyard: ['Many Partings'], command: ['Chishiro, the Shattered Blade']});
  // ?state=pay&auto=1: three untapped lands, and Forge's Auto plan (listed twice) is Forest + one Mountain.
  if (STATE === 'pay' && params.get('auto')) BASE.you.battlefield.splice(1, 0, ['Mountain'], ['Mountain']);
  Object.assign(BASE.cpu, {battlefield: [['Volcanic Island']], hand: 5, graveyard: [], exile: [], command: ['Kenrith, the Returned King']});
}
// The owner's phone report (28 Oct): casting Gnarlid Colony with two tapped Plains across the table.
if (STATE === 'kicker') {
  Object.assign(BASE.you, {battlefield: [['Grizzly Bears'], ['Forest'], ['Forest'], ['Forest']], hand: ['Forest', 'Silver Bolt', 'Silver Bolt', 'Gnarlid Colony', 'Campus Guide'], graveyard: [], command: []});
  Object.assign(BASE.cpu, {battlefield: [['Plains', {tapped: true}], ['Plains', {tapped: true}]], hand: 6, graveyard: ['Raise the Alarm'], exile: [], command: []});
}
if (STATE === 'attack') { BASE.you.battlefield[0][1] = {attacking: true}; BASE.you.battlefield[2][1] = {attacking: true}; }
// Every battlefield badge at once: keywords (with overflow), counters, damage, sickness,
// combat, a planeswalker, a saga, a vehicle, a mana rock, an attached equipment, player
// counters. Rules text is given here so the badges show offline too.
if (STATE === 'badges') {
  Object.assign(BASE.you, {battlefield: [
    ['Serra Angel', {text: 'Flying, vigilance', counters: {P1P1: 2}, damage: 2, power: 6, toughness: 6}],
    ['Questing Beast', {text: 'Vigilance, deathtouch, haste\nQuesting Beast can\u2019t be blocked by creatures with power 2 or less.', attacking: true, power: 4, toughness: 4}],
    ['Goblin Guide', {text: 'Haste', sick: true, power: 2, toughness: 2, commander: true}],
    ['Bonesplitter', {text: 'Equipped creature gets +2/+0.\nEquip {1}', type: 'Artifact \u2014 Equipment', attachTo: 'Goblin Guide'}],
    ['Smuggler\u2019s Copter', {text: 'Flying\nCrew 1', type: 'Artifact \u2014 Vehicle', power: 3, toughness: 3}],
    ['Chandra, Torch of Defiance', {type: 'Legendary Planeswalker \u2014 Chandra', counters: {LOYALTY: 4}}],
    ['History of Benalia', {type: 'Enchantment \u2014 Saga', counters: {LORE: 2}}],
    ['Sol Ring', {text: '{T}: Add {C}{C}.', type: 'Artifact'}],
    ['Forest', {type: 'Basic Land \u2014 Forest'}], ['Forest', {type: 'Basic Land \u2014 Forest', tapped: true}]],
    counters: {POISON: 3}});
  Object.assign(BASE.cpu, {battlefield: [
    ['Baneslayer Angel', {text: 'Flying, first strike, lifelink, protection from Demons and from Dragons', blocking: true, power: 5, toughness: 5, counters: {M1M1: 1, SHIELD: 1, STUN: 1}}],
    ['Darksteel Colossus', {text: 'Trample, indestructible', power: 11, toughness: 11, tapped: true}],
    ['Island', {type: 'Basic Land \u2014 Island'}], ['Island', {type: 'Basic Land \u2014 Island'}]], counters: {ENERGY: 2}});
}
// Equipment and an Aura on your creatures (tucked under their hosts), and the CPU attacking you.
if (STATE === 'attach') BASE.you.battlefield.push(['Swiftfoot Boots', {attachedTo: 'Hill Giant'}], ['Rancor', {attachedTo: 'Goblin Guide'}], ['Grizzly Bears']);
if (STATE === 'block') { BASE.cpu.battlefield[3][1] = {attacking: true}; BASE.cpu.battlefield[4][1] = {attacking: true}; }

// Real card data and art from Scryfall, by name; a missing card falls back to a drawn crest.
const names = [...new Set([
  ...BASE.you.battlefield.map(([n]) => n), ...BASE.you.hand, ...BASE.you.graveyard, ...BASE.you.exile, ...BASE.you.command,
  ...BASE.cpu.battlefield.map(([n]) => n), ...BASE.cpu.graveyard, ...BASE.cpu.exile, ...BASE.cpu.command,
  ...[BASE.cpu2, BASE.cpu3].filter(Boolean).flatMap(side => [...side.battlefield.map(([n]) => n), ...side.graveyard, ...side.command]),
  ...(STATE === 'search' ? ['Forest', 'Mountain', 'Island', 'Plains', 'Swamp', 'Wastes'] : []),
].filter(n => n !== 'Goblin' && n !== 'Food'))];
const scry = new Map();
// A saved copy of the Scryfall cards this fixture uses (fixture-cards.json) loads first, so the board lays out the same
// with or without a network (the design-gate runner only lets GET through); anything missing comes from Scryfall.
try { for (const [name, c] of Object.entries(await (await fetch('./fixture-cards.json')).json())) scry.set(name, c); } catch {}
try {
  const missing = names.filter(n => !scry.has(n));
  for (let i = 0; i < missing.length; i += 70) {
    const r = await fetch('https://api.scryfall.com/cards/collection', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({identifiers: missing.slice(i, i + 70).map(name => ({name}))})});
    for (const c of (await r.json()).data || []) scry.set(c.name, c);
  }
} catch (e) { console.warn('Scryfall unavailable; fixture uses drawn crests', e); }
const face = c => c?.card_faces?.[0] || c || {};
// Forge reports numeric P/T; Scryfall strings such as "*" stay text.
const stat = v => v === null || v === undefined ? null : /^-?\d+$/.test(String(v)) ? Number(v) : v;

let nextId = 100;
const nativeCard = (name, zone, owner, opts = {}) => {
  const c = scry.get(name), f = face(c);
  const token = opts.token === true, creature = token && !opts.type;
  return {
    id: nextId++, owner, controller: owner, zone, hidden: false, name,
    type: opts.type || (token ? 'Token Creature — Goblin' : (c?.type_line || f.type_line || (opts.power !== undefined ? 'Creature' : ''))),
    manaCost: token ? '' : (c?.mana_cost ?? f.mana_cost ?? ''), text: opts.text ?? (token ? 'Haste' : (c?.oracle_text ?? f.oracle_text ?? '')),
    power: opts.power ?? (creature ? 1 : token ? null : stat(c?.power ?? f.power)), toughness: opts.toughness ?? (creature ? 1 : token ? null : stat(c?.toughness ?? f.toughness)),
    tapped: !!opts.tapped, attacking: !!opts.attacking, blocking: !!opts.blocking, token, commander: zone === 'Command' || !!opts.commander,
    damage: opts.damage || 0, summoningSick: !!opts.sick, counters: opts.counters || {},
    // Like the bridge: a keyword list only when the card has keywords.
    ...(kw => kw.length ? {keywords: kw} : {})(creature ? ['Haste'] : token ? [] : (c?.keywords || [])),
    setCode: c?.set || '', imageKey: opts.imageKey || '',
  };
};
const zoneOf = (side, owner) => ({
  Hand: typeof side.hand === 'number' ? {count: side.hand, cards: []} : {count: side.hand.length, cards: side.hand.map(n => nativeCard(n, 'Hand', owner))},
  Library: {count: 81, cards: []},
  Battlefield: {cards: side.battlefield.map(([n, o]) => nativeCard(n, 'Battlefield', owner, o))},
  Graveyard: {cards: side.graveyard.map(n => nativeCard(n, 'Graveyard', owner))},
  Exile: {cards: side.exile.map(n => nativeCard(n, 'Exile', owner))},
  Command: {cards: side.command.map(n => nativeCard(n, 'Command', owner))},
});
const youZones = zoneOf(BASE.you, YOU), cpuZones = zoneOf(BASE.cpu, CPU);
const podZones = POD ? [zoneOf(BASE.cpu2, 3), zoneOf(BASE.cpu3, 4)] : [];
for (const c of podZones[0]?.Battlefield.cards || []) if (c.attacking) c.attackTarget = {kind: 'player', id: YOU};
// Attachments use the native host and attachment ids, as Forge's adapter reports them.
for (const side of [[BASE.you, youZones], [BASE.cpu, cpuZones]]) side[0].battlefield.forEach(([, o], i) => {
  if (!o?.attachTo) return; const card = side[1].Battlefield.cards[i], host = side[1].Battlefield.cards.find(c => c.name === o.attachTo);
  if (host) { card.attachedTo = host.id; host.attachments = [...(host.attachments || []), card.id]; }
});
// Link attachments to their hosts by name, both ways, the way the bridge reports them.
for (const zones of [youZones, cpuZones]) for (const c of zones.Battlefield.cards) {
  const want = [...BASE.you.battlefield, ...BASE.cpu.battlefield].find(([n, o]) => n === c.name && o?.attachedTo)?.[1]?.attachedTo;
  const host = want && zones.Battlefield.cards.find(h => h.name === want && !h.attachments?.length);
  if (host) { c.attachedTo = host.id; host.attachments = [c.id]; }
}
for (const c of cpuZones.Battlefield.cards) if (c.attacking) c.attackTarget = {kind: 'player', id: YOU};
for (const c of youZones.Battlefield.cards) if (c.attacking) c.attackTarget = {kind: 'player', id: CPU};
const ref = c => ({kind: 'card', id: c.id});
const byName = (zone, name) => zone.cards.filter(c => c.name === name);

const yourTurn = STATE !== 'cpu' && STATE !== 'block' && STATE !== 'podattack';
const turn = STATE === 'early' ? 2 : 5;
const phase = STATE === 'podattack' ? 'COMBAT_DECLARE_BLOCKERS' : STATE === 'attack' || STATE === 'podswing' ? 'COMBAT_DECLARE_ATTACKERS' : STATE === 'block' ? 'COMBAT_DECLARE_BLOCKERS' : 'MAIN1';
const inputType = {targets: 'InputSelectTargets', attack: 'InputAttack', podswing: 'InputAttack', block: 'InputBlock', podattack: 'InputBlock', cpu: 'InputPassPriority', discard: '', opening: 'InputConfirmMulligan', pay: 'InputPayManaOfCostPayment'}[STATE] ?? 'InputPassPriority';
const castable = ['Lightning Bolt', 'Monastery Swiftspear', 'Play with Fire', 'Skewer the Critics', 'Forest', 'Llanowar Elves'];
const selection = {cards: [], targets: [], chosen: [], actionable: []};
let castEvent = null;
if (STATE === 'main' || STATE === 'dense' || STATE === 'crowded') {
  selection.actionable = [...youZones.Hand.cards.filter(c => castable.includes(c.name)), ...byName(youZones.Battlefield, 'Arcane Signet')].map(ref);
} else if (STATE === 'targets') {
  selection.targets = [...cpuZones.Battlefield.cards.filter(c => /Creature/.test(c.type)), ...youZones.Battlefield.cards.filter(c => /Creature/.test(c.type))].map(ref);
  selection.targets.push({kind: 'player', id: CPU}, {kind: 'player', id: YOU});
  selection.chosen = [ref(byName(cpuZones.Battlefield, 'Hill Giant')[0])];
  // The Bolt has left the hand for the stack (Forge holds it there until its targets are locked in).
  castEvent = (() => { const i = youZones.Hand.cards.findIndex(c => c.name === 'Lightning Bolt'); const [bolt] = i < 0 ? [] : youZones.Hand.cards.splice(i, 1); if (bolt) { bolt.zone = 'Stack'; youZones.Stack = {cards: [bolt]}; } return bolt ? {seq: 1, type: 'zone', turn, phase: 'MAIN1', card: {kind: 'card', id: bolt.id, name: bolt.name}, from: 'Hand', to: 'Stack', player: YOU, token: false} : null; })();
} else if (STATE === 'discard') {
  Object.assign(selection, {cards: youZones.Hand.cards.map(ref), min: 1, max: 1});
} else if (STATE === 'pay') {
  const lands = ['Forest', 'Mountain'].flatMap(n => byName(youZones.Battlefield, n));
  selection.actionable = params.get('auto') ? [...lands, lands[0], lands[1]].map(ref) : [];
} else if (STATE === 'block' || STATE === 'podattack') {
  selection.cards = youZones.Battlefield.cards.filter(c => /Creature/.test(c.type)).map(ref);
} else if (STATE === 'attack' || STATE === 'podswing') {
  selection.cards = youZones.Battlefield.cards.filter(c => /Creature/.test(c.type)).map(ref);
}
const message = {
  targets: 'Select targets for Lightning Bolt\nChoose any target.',
  attack: 'Declare attackers.', podswing: 'Declare attackers.',
  block: 'Declare blockers.', podattack: 'Declare blockers.',
  pay: 'Food Token (204) - {2}, {T}, Sacrifice this token: You gain 3 life.\nPay Mana Cost: {2}',
  opening: 'Keep this hand or mulligan?',
  discard: 'Cleanup Phase\nSelect 1 card(s) to discard to bring your hand down to the maximum of 7 cards.',
}[STATE] || `Priority: ${yourTurn ? 'idw011' : 'CPU'}\nTurn: ${turn} (${yourTurn ? 'idw011' : 'CPU'})\nPhase: Main phase 1\nStack: Empty`;
// A library search the way Forge offers it: one option per eligible card.
const prompt = STATE === 'search' ? {id: 'fixture-many-partings', supported: true, method: 'chooseSingleEntityForEffect', min: 0, max: 1, cancelable: true,
  message: 'Many Partings (63) - Search your library for a basic land card, reveal it, put it into your hand, then shuffle. Create a Food token.\nSelect a card from your library',
  options: ['Forest', 'Forest', 'Mountain', 'Mountain', 'Mountain', 'Island', 'Plains', 'Swamp', 'Forest', 'Mountain', 'Wastes', 'Forest'].map((name, index) => ({index, value: {...nativeCard(name, 'Library', YOU), kind: 'card'}}))}
  // Casting a kicker spell: Forge's many() arrives as an order prompt of optional costs.
  : STATE === 'kicker' ? {id: 'fixture-kicker', supported: true, method: 'order', ordered: true, min: 0, max: 1, remainingMin: 0, remainingMax: 1, sourceIndexes: [0], destinationIndexes: [], rememberAllowed: false, topLabel: 'Optional costs',
    message: 'Choose optional costs — Optional costs', options: [{index: 0, value: {kind: 'optionalCost', description: 'Kicker {2}{G}'}}]}
  // Two of your triggers fire together: Forge asks for their order.
  : STATE === 'triggers' ? {id: 'fixture-triggers', supported: true, method: 'order', ordered: true, min: 2, max: 2, remainingMin: 2, remainingMax: 2, sourceIndexes: [0, 1], destinationIndexes: [], rememberAllowed: false, topLabel: 'Resolve first',
    message: 'Select order for simultaneous abilities — Resolve first', options: [
      {index: 0, value: {kind: 'ability', id: 917, description: 'Grizzly Bears (49): Whenever a land you control enters, create a Food token or a Treasure token. (Food is an artifact with "{2}, {T}, Sacrifice this token: You gain 3 life.") [Zone Changer: Forest (78)]', card: nativeCard('Grizzly Bears', 'Battlefield', YOU)}},
      {index: 1, value: {kind: 'ability', id: 918, description: 'Hill Giant (50): Whenever a land you control enters, you may draw a card. [Zone Changer: Forest (78)]', card: nativeCard('Hill Giant', 'Battlefield', YOU)}}]} : null;
const stackCard = STATE === 'targets' ? nativeCard('Counterspell', 'Stack', CPU) : null;
const native = {
  schema: 'cardstashy.forge-proof.v1', revision: 7, viewer: YOU, status: 'running', busy: false,
  players: [
    {id: YOU, name: 'idw011', life: 40, isViewer: true, counters: BASE.you.counters || {}, mana: {W: 0, U: 0, B: 0, R: ['targets', 'pay'].includes(STATE) ? 0 : 2, G: 0, C: 0}, zones: youZones},
    {id: CPU, name: 'CPU', life: 38, isViewer: false, counters: BASE.cpu.counters || {}, mana: {W: 0, U: 0, B: 0, R: 0, G: 0, C: 0}, zones: cpuZones},
    ...podZones.map((zones, i) => ({id: 3 + i, name: `Forge AI ${i + 3}`, life: [31, 40][i], isViewer: false, lost: STATE === 'podout' && i === 1, counters: {}, mana: {W: 0, U: 0, B: 0, R: 0, G: 0, C: 0}, zones, deckAlias: ['Goblin Swarm', 'Angel Tribal'][i]})),
  ],
  stack: stackCard ? [{id: 990, text: 'Counterspell — Counter target spell.', source: stackCard, activatingPlayer: CPU}] : STATE === 'crowded' ? Array.from({length: 4}, (_, i) => ({id: 980 + i, text: 'Soul Warden — Whenever another creature enters, you gain 1 life.', source: null, activatingPlayer: YOU, ability: true, yielded: false})) : [], turn, phase, activePlayer: yourTurn ? YOU : CPU, priorityPlayer: yourTurn ? YOU : CPU,
  inputType: prompt ? '' : inputType, prompt, message, controlMode: 'smart', ...(STATE === 'crowded' ? {phaseStops: {'you:UPKEEP': true, 'opponent:END_OF_TURN': false}} : {}), notification: {}, lastActionError: null,
  buttons: STATE === 'opening' ? {ok: 'Keep', okEnabled: true, cancel: 'Mulligan', cancelEnabled: true}
    : STATE === 'discard' ? {ok: 'OK', okEnabled: false, cancel: '', cancelEnabled: false}
    : STATE === 'targets' ? {ok: 'OK', okEnabled: true, cancel: 'Cancel', cancelEnabled: true}
    : STATE === 'attack' || STATE === 'podswing' ? {ok: 'OK', okEnabled: true, cancel: 'Cancel', cancelEnabled: false}
    : STATE === 'block' || STATE === 'podattack' ? {ok: 'OK', okEnabled: true, cancel: '', cancelEnabled: false}
    : STATE === 'pay' ? {ok: 'Auto', okEnabled: false, cancel: 'Cancel', cancelEnabled: true}
    : yourTurn ? {ok: 'OK', okEnabled: true, cancel: 'End turn', cancelEnabled: true} : {},
  selection, events: {schema: 1, latest: castEvent ? 1 : 0, items: castEvent ? [castEvent] : []},
  ...(STATE === 'pay' ? {payment: {remaining: '{2}', forCard: {kind: 'card', id: byName(youZones.Battlefield, 'Food')[0].id, name: 'Food Token'}}} : {}),
};

if (POD) {
  const cmd = (zones, owner) => zones.Command.cards[0]?.name;
  native.players[0].commanderDamage = [{from: CPU, commander: cmd(cpuZones), damage: 0}, {from: 3, commander: cmd(podZones[0]), damage: 7}, {from: 4, commander: cmd(podZones[1]), damage: 0}];
  native.players[0].life = 33; native.turnOrder = [YOU, CPU, 3, 4];
  if (STATE === 'podattack') { native.activePlayer = 3; native.priorityPlayer = YOU; }
}
const lookupArtwork = name => { const c = scry.get(name); return c ? {card: Object.freeze(c), finish: null, source: 'existing-catalog-printing', badges: []} : null; };
const session = createForgePresentationSession({lookupArtwork, allowControlMode: true, request: async (path, body) => {
  if (body) { console.info('fixture action (not sent)', body); throw Object.assign(Error('Fixture: actions are not sent'), {status: 400}); }
  return null;
}});
session.acceptState(native);
const avatar = scry.get('Klothys, God of Destiny')?.image_uris?.art_crop || '';
const root = document.getElementById('practicePlayerMat');
window.fixture = {session, native, table: mountForgeTable(root, {session, profile: {displayName: 'idw011', username: 'idw011', avatarUrl: avatar}, format: 'Commander', title: 'CardStashy · Magic · fixture', onExit() {}, presentation: {hosted: true, allowControlMode: true, tracker: [['Legion Warboss', 2], ['Goblin Guide', 1], ['Hill Giant', 2], ['Grizzly Bears', 2], ['Rancor', 1], ['Sol Ring', 1], ['Arcane Signet', 1], ['Loyal Apprentice', 1], ['Rampant Growth', 1], ['Mountain', 14], ['Forest', 12]].map(([name, qty]) => ({name, qty, art: '', cost: '', land: /^(Mountain|Forest)$/.test(name)}))}})};
document.body.dataset.fixtureReady = 'true';
</script>
</body>
