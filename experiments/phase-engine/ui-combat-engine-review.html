<!doctype html><html><meta charset="utf-8"><title>Combat interaction evidence</title><style>body{margin:0;background:#0d171d;color:#e1e7e6;font:14px system-ui}header{height:58px;padding:12px;display:flex;align-items:center;gap:20px;box-sizing:border-box}select,button{font:inherit;padding:7px;background:#25404b;color:inherit;border:1px solid #b8cbd166;border-radius:8px}iframe{display:block;border:0}pre{white-space:pre-wrap;max-width:1200px;padding:15px}</style><header><strong>Engine-connected UI fixture</strong><label>Viewport <select id="size"><option>1180x757</option><option>1440x900</option><option>1920x1080</option><option>590x378</option></select></label><button id="reset">Reset engineered position</button><output id="status">Loading existing engine</output></header><iframe id="game" title="Combat evidence" width="1180" height="757" src="ui-combat-engine.html"></iframe><pre id="evidence"></pre><script>const f=document.querySelector('iframe'),size=document.querySelector('select'),history=[];size.onchange=()=>{const[w,h]=size.value.split('x');f.width=w;f.height=h};document.querySelector('button').onclick=()=>{history.length=0;f.src='ui-combat-engine.html';document.querySelector('output').textContent='Loading existing engine';};addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==f.contentWindow)return;if(e.data.ready)document.querySelector('output').textContent='Ready';if(e.data.diagnostic||e.data.receipt||e.data.evidence||e.data.ui||e.data.fixtureError){history.push(e.data);document.querySelector('pre').textContent=JSON.stringify(history,null,2);}});</script></html>
