<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardStashy Play UI Review</title>
<style>body{margin:0;background:#0c1110;color:#eee;font:14px system-ui}header{position:sticky;left:0;top:0;display:flex;align-items:center;gap:14px;padding:14px;z-index:10;background:#151c18}button,select{background:#26332b;color:#eee;border:1px solid #59614e;border-radius:8px;padding:9px;font:inherit}iframe{display:block;border:0}pre{white-space:pre-wrap;padding:15px}label{display:flex;align-items:center;gap:7px}</style>
<header><strong>UI review fixture</strong><label>Scenario<select id="scenario"><option>opening</option><option>crowded</option><option>payment</option><option>damage</option><option>hidden</option><option>actions</option><option>mulligan</option><option>response</option><option>target</option><option>combat</option><option>controls</option><option>commander</option></select></label><label>Viewport<select id="size"><option>1280x720</option><option>1920x1080</option><option>2560x1080</option><option>3440x1440</option><option>1024x768</option><option>900x650</option><option>1180x757</option><option>590x378</option></select></label><label>Theme<select id="theme"><option>dark</option><option>light</option></select></label><button id="suite">Run layout matrix</button><button id="regression">Check selection and clocks</button><button id="focused">Check changed layouts</button><button id="decisions">Check decision flows</button><output id="status">Loading</output></header>
<iframe id="preview" title="Play UI preview"></iframe><pre id="results"></pre>
<script>
addEventListener('error',e=>document.getElementById('results').textContent=e.message);addEventListener('unhandledrejection',e=>document.getElementById('results').textContent=String(e.reason));
const frame=document.getElementById('preview'),scenario=document.getElementById('scenario'),size=document.getElementById('size'),theme=document.getElementById('theme'),status=document.getElementById('status'),results=document.getElementById('results');let readyResolve=null,measureResolve=null;
function load(){const [w,h]=size.value.split('x');frame.width=w;frame.height=h;frame.src='./ui-review.html?case='+scenario.value+'&theme='+theme.value;status.textContent='Loading';}
for(const c of [scenario,size,theme])c.addEventListener('change',load);
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.fixtureError){results.textContent=JSON.stringify(e.data);status.textContent='Fixture error';return;}if(e.data.ready){status.textContent='Ready';if(readyResolve){readyResolve();readyResolve=null;}}else if(measureResolve){measureResolve(e.data);measureResolve=null;}else results.textContent=JSON.stringify(e.data,null,2);});
document.getElementById('suite').onclick=async()=>{const rows=[];results.textContent='';for(const sc of ['opening','crowded','payment','damage','hidden','actions','mulligan','response','target','combat','controls','commander']){scenario.value=sc;size.value='1280x720';await new Promise(resolve=>{readyResolve=resolve;load();});for(const dim of ['1280x720','1920x1080','2560x1080','3440x1440','1024x768','900x650','1180x757','590x378']){size.value=dim;const [w,h]=dim.split('x');frame.width=w;frame.height=h;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));rows.push(frame.contentWindow.runLayoutReview());status.textContent=rows.length+' cases';}}results.textContent=JSON.stringify({passed:rows.every(r=>r.passed),cases:rows},null,2);status.textContent=rows.every(r=>r.passed)?rows.length+' PASS':'Review failures';};
document.getElementById('regression').onclick=()=>{results.textContent=JSON.stringify(frame.contentWindow.runInteractionReview(),null,2);};document.getElementById('focused').onclick=async()=>{const rows=[];for(const sc of ['actions','controls','commander']){scenario.value=sc;size.value='1180x757';await new Promise(resolve=>{readyResolve=resolve;load();});for(const dim of ['1180x757','1280x720','590x378']){size.value=dim;const [w,h]=dim.split('x');frame.width=w;frame.height=h;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));rows.push(frame.contentWindow.runLayoutReview());}}results.textContent=JSON.stringify({passed:rows.every(r=>r.passed),cases:rows},null,2);status.textContent=rows.every(r=>r.passed)?'9 changed layouts PASS':'Review failures';};
document.getElementById('decisions').onclick=async()=>{const rows=[];size.value='1180x757';for(const sc of ['mulligan','target','combat','actions','damage','controls','commander']){scenario.value=sc;await new Promise(resolve=>{readyResolve=resolve;load();});rows.push(await frame.contentWindow.runDecisionReview());}results.textContent=JSON.stringify({passed:rows.every(r=>r.passed),cases:rows},null,2);status.textContent=rows.every(r=>r.passed)?'Decision flows PASS':'Decision flow failure';};load();
</script></html>
